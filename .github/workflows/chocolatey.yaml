name: Publish Chocolatey Package

on:
  release:
    types: [published]

jobs:
  chocolatey:
    name: Publish to Chocolatey
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release version
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download Windows binary and compute SHA256
        id: sha
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $url = "https://github.com/jagadesh31/Portshare/releases/download/v$version/portshare-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile portshare.exe
          $sha = (Get-FileHash portshare.exe -Algorithm SHA256).Hash.ToLower()
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Update install script with real checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $sha = "${{ steps.sha.outputs.sha }}"
          $content = Get-Content chocolatey/tools/chocolateyInstall.ps1 -Raw
          $content = $content -replace "\`\$version = '.*'", "`$version = '$version'"
          $content = $content -replace 'PLACEHOLDER_SHA256', $sha
          Set-Content chocolatey/tools/chocolateyInstall.ps1 $content

      - name: Install Chocolatey and pack
        shell: pwsh
        run: |
          choco pack chocolatey/portshare.nuspec --version ${{ steps.version.outputs.tag }} --output-directory chocolatey/

      - name: Push to Chocolatey
        shell: pwsh
        run: |
          choco push chocolatey/portshare.${{ steps.version.outputs.tag }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
